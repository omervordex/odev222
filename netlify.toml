[build]
  command = "npm run build:static"
  publish = "public"
  functions = "netlify/functions"

# Node 22 is the oldest LTS with a native WebSocket. Netlify uses this
# build version for the Function runtime. Node 20 makes @supabase/realtime-js
# throw while createClient() looks up that constructor.
[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  external_node_modules = [
    "express",
    "ejs",
    "@supabase/supabase-js",
    "serverless-http",
    "cookie-session",
    "multer",
    "bcryptjs",
    "helmet",
    "express-validator"
  ]
  included_files = ["views/**/*.ejs"]

# Existing files in public/ are served by the CDN. Everything else goes to Express.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server/:splat"
  status = 200
